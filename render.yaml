services:
  - type: web
    name: your-service-name
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py import_menu_assets"
    startCommand: "gunicorn dukan.wsgi:application --bind 0.0.0.0:$PORT --preload"
    routes:
      - type: static
        name: static
        path: /static/
        source: staticfiles/
